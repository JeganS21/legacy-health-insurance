spring.application.name=insurance
# 8081 so it can run alongside the claims demo (8080)
server.port=8081

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/legacy_health_insurance?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
# "update" keeps data between restarts, so files are not processed twice
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- MCP server (Claude Desktop connects to http://localhost:8081/mcp) ----------
spring.ai.mcp.server.name=insurance-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# ---------- Google Drive ----------
# Service-account key file (never commit it - it's in .gitignore)
insurance.drive.credentials-path=credentials/service-account.json
# The ID from the Drive folder URL: https://drive.google.com/drive/folders/<THIS_PART>
insurance.drive.folder-id=1rEPUWWYXSFChxh6Z7mVLAwz4RiqaimBu

# ---------- Workflow ----------
# Check Drive every 5 minutes (300000 ms)
insurance.poll-interval-ms=300000
# Your field definitions + instructions for Claude (edit this file, no rebuild needed)
insurance.workflow-path=workflow.yaml
# Excel output (close it in Excel while the server writes, or the write retries next sync)
insurance.excel.path=output/insurance_details.xlsx

# ---------- Logs ----------
logging.file.name=logs/insurance.log
logging.level.com.LegacyhealthInsurance=INFO
